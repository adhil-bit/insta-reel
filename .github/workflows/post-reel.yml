name: Post reel

# Posts the next reel in the queue (oldest first) at the day-wise times below,
# or a specific reel when run by hand.
on:
  workflow_dispatch:
    inputs:
      reel:
        description: "Reel to post (release name). Leave empty for the next one in the queue."
        required: false
        default: ""
      action:
        description: "Post it, or reject it so it's never posted"
        type: choice
        options: [post, reject, auto]
        default: post

permissions:
  contents: write

concurrency:
  group: autoreel-post
  cancel-in-progress: false

env:
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use the latest history (a queued run must see posts made while it waited)
        run: git fetch -q origin main && git reset -q --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      - name: Pick the reel
        env:
          INPUT_REEL: ${{ github.event.inputs.reel }}
        run: |
          pip install -q -r requirements.txt
          AUTO=0; { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.action }}" = "auto" ]; } && AUTO=1
          if [ "$AUTO" = "1" ]; then W=$(python main.py slot-wait); [ "$W" -gt 0 ] && { echo "Waiting ${W}s for the slot"; sleep "$W"; }; fi
          if [ "$AUTO" = "1" ] && [ "$(python main.py due)" != "yes" ]; then
            echo "No posting slot due right now."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          [ "$AUTO" = "1" ] && sleep $(( RANDOM % 150 ))
          REEL="${INPUT_REEL:-$(python main.py next)}"
          if [ -z "$REEL" ]; then echo "Queue is empty, nothing to post."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "REEL=$REEL" >> "$GITHUB_ENV"
          echo "Selected: $REEL"

      - name: Reject the reel
        if: ${{ env.SKIP != '1' && github.event.inputs.action == 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python main.py skip "$REEL"
          gh release edit "$REEL" --title "REJECTED · $REEL" || true

      - name: Cache FFmpeg
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      - name: Get FFmpeg (static build, cached)
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        run: |
          if [ ! -x ~/ffmpeg/ffmpeg ]; then
            mkdir -p ~/ffmpeg
            curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - name: Download and post
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "output/$REEL" logs
          gh release download "$REEL" --dir "output/$REEL" --clobber
          python main.py post "$REEL" 2>&1 | tee logs/last-post-log.txt
          [ "${PIPESTATUS[0]}" = "0" ] || exit 1
          gh release edit "$REEL" --title "POSTED · $REEL"

      - name: Telegram alert (posted)
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        run: |
          LINK=$(grep -o 'https://www.instagram.com/[^ ]*' logs/last-post-log.txt | tail -1)
          TITLE=$(python -c "import json;h=json.load(open('history.json'));print(next((e.get('title','') for e in h if e['folder']=='$REEL'),'$REEL'))")
          WHEN=$(TZ=Asia/Kolkata date '+%a %d %b, %I:%M %p IST')
          COUNTS=$(python main.py status | sed -n 2,3p | tr '\n' ' ')
          bash scripts/notify.sh "$(printf '✅ Posted to Instagram\n%s\n%s\n%s\n%s' "$TITLE" "$LINK" "$WHEN" "$COUNTS")"

      - name: Telegram alert (post failed)
        if: ${{ failure() }}
        run: |
          ERR=$(tail -c 500 logs/last-post-log.txt 2>/dev/null || echo "see GitHub Actions log")
          WHEN=$(TZ=Asia/Kolkata date '+%a %d %b, %I:%M %p IST')
          bash scripts/notify.sh "$(printf '❌ Post FAILED: %s\n%s\nError: %s\nhttps://github.com/%s/actions/runs/%s' "${REEL:-unknown reel}" "$WHEN" "$ERR" "${{ github.repository }}" "${{ github.run_id }}")"

      - name: Also upload to YouTube Shorts
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        continue-on-error: true
        run: python main.py youtube "$REEL" 2>&1 | tee -a logs/last-post-log.txt

      - name: Save history and log
        if: ${{ always() && env.SKIP != '1' }}
        run: bash scripts/save_history.sh "post $REEL"
