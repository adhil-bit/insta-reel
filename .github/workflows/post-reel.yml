name: Post reel

# Posts the next reel in the queue (oldest first) at the day-wise times below,
# or a specific reel when run by hand.
on:
  schedule:   # day-wise times from the posting table (IST), written in UTC
    - cron: "30 23 * * 0"   # Mon 05:00 IST
    - cron: "30 3 * * 1"    # Mon 09:00 IST
    - cron: "30 15 * * 1"   # Mon 21:00 IST
    - cron: "30 19 * * 1"   # Tue 01:00 IST
    - cron: "30 21 * * 1"   # Tue 03:00 IST
    - cron: "30 2 * * 2"    # Tue 08:00 IST
    - cron: "30 0 * * 3"    # Wed 06:00 IST
    - cron: "30 1 * * 3"    # Wed 07:00 IST
    - cron: "30 16 * * 3"   # Wed 22:00 IST
    - cron: "30 2 * * 4"    # Thu 08:00 IST
    - cron: "30 5 * * 4"    # Thu 11:00 IST
    - cron: "30 22 * * 4"   # Fri 04:00 IST
    - cron: "30 6 * * 5"    # Fri 12:00 IST
    - cron: "30 8 * * 5"    # Fri 14:00 IST
    - cron: "30 4 * * 6"    # Sat 10:00 IST
    - cron: "30 12 * * 6"   # Sat 18:00 IST
    - cron: "30 13 * * 6"   # Sat 19:00 IST
    - cron: "30 0 * * 0"    # Sun 06:00 IST
    - cron: "30 1 * * 0"    # Sun 07:00 IST
    - cron: "30 9 * * 0"    # Sun 15:00 IST
  workflow_dispatch:
    inputs:
      reel:
        description: "Reel to post (release name). Leave empty for the next one in the queue."
        required: false
        default: ""
      action:
        description: "Post it, or reject it so it's never posted"
        type: choice
        options: [post, reject]
        default: post

permissions:
  contents: write

concurrency:
  group: autoreel-post
  cancel-in-progress: false

env:
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pick the reel
        env:
          INPUT_REEL: ${{ github.event.inputs.reel }}
        run: |
          pip install -q -r requirements.txt
          REEL="${INPUT_REEL:-$(python main.py next)}"
          if [ -z "$REEL" ]; then echo "Queue is empty, nothing to post."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "REEL=$REEL" >> "$GITHUB_ENV"
          echo "Selected: $REEL"

      - name: Reject the reel
        if: ${{ env.SKIP != '1' && github.event.inputs.action == 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python main.py skip "$REEL"
          gh release edit "$REEL" --title "REJECTED · $REEL" || true

      - name: Install FFmpeg
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Download and post
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "output/$REEL" logs
          gh release download "$REEL" --dir "output/$REEL" --clobber
          python main.py post "$REEL" 2>&1 | tee logs/last-post-log.txt
          [ "${PIPESTATUS[0]}" = "0" ] || exit 1
          gh release edit "$REEL" --title "POSTED · $REEL"

      - name: Also upload to YouTube Shorts
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        continue-on-error: true
        run: python main.py youtube "$REEL" 2>&1 | tee -a logs/last-post-log.txt

      - name: Save history and log
        if: ${{ always() && env.SKIP != '1' }}
        run: bash scripts/save_history.sh "post $REEL"
