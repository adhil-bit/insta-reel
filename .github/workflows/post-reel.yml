name: Post reel

# Posts the next reel in the queue (oldest first) twice a day (add a cron line for more),
# or a specific reel when run by hand.
on:
  schedule:
    - cron: "30 7 * * *"    # 13:00 IST
    - cron: "0 14 * * *"    # 19:30 IST
  workflow_dispatch:
    inputs:
      reel:
        description: "Reel to post (release name). Leave empty for the next one in the queue."
        required: false
        default: ""
      action:
        description: "Post it, or reject it so it's never posted"
        type: choice
        options: [post, reject]
        default: post

permissions:
  contents: write

concurrency:
  group: autoreel-post
  cancel-in-progress: false

env:
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pick the reel
        env:
          INPUT_REEL: ${{ github.event.inputs.reel }}
        run: |
          pip install -q -r requirements.txt
          REEL="${INPUT_REEL:-$(python main.py next)}"
          if [ -z "$REEL" ]; then echo "Queue is empty, nothing to post."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "REEL=$REEL" >> "$GITHUB_ENV"
          echo "Selected: $REEL"

      - name: Reject the reel
        if: ${{ env.SKIP != '1' && github.event.inputs.action == 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python main.py skip "$REEL"
          gh release edit "$REEL" --title "REJECTED · $REEL" || true

      - name: Install FFmpeg
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Download and post
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "output/$REEL" logs
          gh release download "$REEL" --dir "output/$REEL" --clobber
          python main.py post "$REEL" 2>&1 | tee logs/last-post-log.txt
          [ "${PIPESTATUS[0]}" = "0" ] || exit 1
          gh release edit "$REEL" --title "POSTED · $REEL"

      - name: Save history and log
        if: ${{ always() && env.SKIP != '1' }}
        run: |
          git config user.name "autoreel-bot"
          git config user.email "autoreel-bot@users.noreply.github.com"
          git add history.json logs 2>/dev/null || true
          git commit -m "post: $REEL" || exit 0
          git pull --rebase && git push
