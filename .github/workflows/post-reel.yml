name: Post reel

# Posts the next reel in the queue (oldest first) at the day-wise times below,
# or a specific reel when run by hand.
on:
  schedule:   # table times shifted a few minutes off the hour (IST), written in UTC
    - cron: "24 23 * * 0"   # Mon 04:54 IST
    - cron: "36 3 * * 1"    # Mon 09:06 IST
    - cron: "23 15 * * 1"   # Mon 20:53 IST
    - cron: "35 19 * * 1"   # Tue 01:05 IST
    - cron: "26 21 * * 1"   # Tue 02:56 IST
    - cron: "37 2 * * 2"    # Tue 08:07 IST
    - cron: "25 0 * * 3"    # Wed 05:55 IST
    - cron: "34 1 * * 3"    # Wed 07:04 IST
    - cron: "36 16 * * 3"   # Wed 22:06 IST
    - cron: "23 2 * * 4"    # Thu 07:53 IST
    - cron: "35 5 * * 4"    # Thu 11:05 IST
    - cron: "36 22 * * 4"   # Fri 04:06 IST
    - cron: "24 6 * * 5"    # Fri 11:54 IST
    - cron: "37 8 * * 5"    # Fri 14:07 IST
    - cron: "34 4 * * 6"    # Sat 10:04 IST
    - cron: "25 12 * * 6"   # Sat 17:55 IST
    - cron: "36 13 * * 6"   # Sat 19:06 IST
    - cron: "35 0 * * 0"    # Sun 06:05 IST
    - cron: "23 1 * * 0"    # Sun 06:53 IST
    - cron: "34 9 * * 0"    # Sun 15:04 IST
  workflow_dispatch:
    inputs:
      reel:
        description: "Reel to post (release name). Leave empty for the next one in the queue."
        required: false
        default: ""
      action:
        description: "Post it, or reject it so it's never posted"
        type: choice
        options: [post, reject]
        default: post

permissions:
  contents: write

concurrency:
  group: autoreel-post
  cancel-in-progress: false

env:
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.instagram.com' }}
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Random extra delay (0-4 min) so posts never land at a fixed minute
        if: ${{ github.event_name == 'schedule' }}
        run: sleep $(( RANDOM % 240 ))

      - name: Pick the reel
        env:
          INPUT_REEL: ${{ github.event.inputs.reel }}
        run: |
          pip install -q -r requirements.txt
          REEL="${INPUT_REEL:-$(python main.py next)}"
          if [ -z "$REEL" ]; then echo "Queue is empty, nothing to post."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "REEL=$REEL" >> "$GITHUB_ENV"
          echo "Selected: $REEL"

      - name: Reject the reel
        if: ${{ env.SKIP != '1' && github.event.inputs.action == 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python main.py skip "$REEL"
          gh release edit "$REEL" --title "REJECTED · $REEL" || true

      - name: Cache FFmpeg
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1

      - name: Get FFmpeg (static build, cached)
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        run: |
          if [ ! -x ~/ffmpeg/ffmpeg ]; then
            mkdir -p ~/ffmpeg
            curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - name: Download and post
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "output/$REEL" logs
          gh release download "$REEL" --dir "output/$REEL" --clobber
          python main.py post "$REEL" 2>&1 | tee logs/last-post-log.txt
          [ "${PIPESTATUS[0]}" = "0" ] || exit 1
          gh release edit "$REEL" --title "POSTED · $REEL"

      - name: Also upload to YouTube Shorts
        if: ${{ env.SKIP != '1' && github.event.inputs.action != 'reject' }}
        continue-on-error: true
        run: python main.py youtube "$REEL" 2>&1 | tee -a logs/last-post-log.txt

      - name: Save history and log
        if: ${{ always() && env.SKIP != '1' }}
        run: bash scripts/save_history.sh "post $REEL"
