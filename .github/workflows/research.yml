name: Web research for a reel

on:
  workflow_dispatch:
    inputs:
      slug:
        required: true
      queries:
        description: "Search queries separated by |"
        required: true
      focus:
        description: "Only read articles whose title matches this (regex)"
        required: false
        default: "."
      wiki_pages:
        description: "Wikipedia pages to read in full, separated by |"
        required: false
        default: ""
      follow:
        description: "Only follow articles whose titles contain these words (|-separated)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - env:
          FOLLOW: ${{ github.event.inputs.follow }}
        run: python scripts/research.py "${{ github.event.inputs.slug }}" "${{ github.event.inputs.queries }}"
      - run: |
          git config user.name "autoreel-bot"; git config user.email "autoreel-bot@users.noreply.github.com"
          git add logs/research && git commit -qm "research: ${{ github.event.inputs.slug }}" && git pull -q --rebase && git push -q || true
