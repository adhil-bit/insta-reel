name: Voice test

# Makes a short sample of every voice so you can pick favourites. Posts nothing.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get FFmpeg
        run: |
          mkdir -p ~/ffmpeg
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      - run: pip install -q -r requirements.txt
      - name: Make samples
        run: |
          mkdir -p logs/voices
          python - << 'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          import config
          from pipeline import media
          line = "1883-ൽ തലശ്ശേരിയിലെ ഒരു ബേക്കറിയിൽ ഇന്ത്യയിലെ ആദ്യത്തെ ക്രിസ്മസ് കേക്ക് പിറന്നു. അതിന് പിന്നിൽ ഒരു രസകരമായ കഥയുണ്ട്."
          out = {}
          pools = [("edge", config.EDGE_VOICE_POOL[:2])]
          if config.GEMINI_API_KEY:
              pools.append(("gemini", config.GEMINI_VOICE_POOL))
          for provider, pool in pools:
              for v in pool:
                  f = Path(f"logs/voices/{provider}-{v['name'].split(' ')[0].lower()}.mp3")
                  try:
                      media.generate_voice(line, f, v["id"], provider=provider)
                      out[f.name] = f.stat().st_size
                  except Exception as e:
                      out[f.name] = f"error: {str(e)[:200]}"
          json.dump(out, open("logs/voices/result.json", "w"), indent=2, ensure_ascii=False); print(out)
          PY
      - run: |
          git config user.name "autoreel-bot"; git config user.email "autoreel-bot@users.noreply.github.com"
          git add logs && git commit -qm "voice samples" && git pull -q --rebase && git push -q || true
