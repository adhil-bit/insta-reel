name: Instagram stats (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests python-dotenv
      - run: python scripts/stats.py
      - run: |
          git config user.name "autoreel-bot"; git config user.email "autoreel-bot@users.noreply.github.com"
          git add logs/stats.json && git commit -qm "stats" && git pull -q --rebase && git push -q || true
