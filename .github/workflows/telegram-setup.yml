name: Telegram setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the chat id and send a test message
        run: bash -x scripts/telegram_setup.sh > logs/telegram-debug.txt 2>&1 || echo "setup script failed (see logs/telegram-debug.txt)"
      - name: Save the result
        if: ${{ always() }}
        run: |
          git config user.name "autoreel-bot"; git config user.email "autoreel-bot@users.noreply.github.com"
          sed -i 's/bot[0-9]*:[A-Za-z0-9_-]*/bot***/g' logs/telegram-debug.txt
          git add logs && git commit -qm "telegram setup" && git pull -q --rebase && git push -q || true
