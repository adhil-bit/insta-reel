name: Telegram setup

on:
  workflow_dispatch:
    inputs:
      send_status:
        description: "Send the pipeline status to Telegram"
        required: false
        default: "no"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the chat id and send a test message
        run: |
          mkdir -p logs
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" > logs/telegram-updates.json
          python3 - << 'PY'
          import json
          d = json.load(open("logs/telegram-updates.json"))
          ids = {}
          for u in d.get("result", []):
              c = (u.get("message") or u.get("my_chat_member") or u.get("channel_post") or {}).get("chat")
              if c: ids[str(c["id"])] = c.get("title") or c.get("first_name", "")
          json.dump({"chat_ids": ids}, open("logs/telegram.json", "w"), indent=2); print(ids or "no messages yet: send /start to the bot first")
          PY
          rm -f logs/telegram-updates.json
          if [ "${{ github.event.inputs.send_status }}" = "yes" ]; then
            pip install -q -r requirements.txt >/dev/null 2>&1 || true
            bash scripts/notify.sh "$(python main.py status)"
          else
            if [ -n "$TELEGRAM_CHAT_ID" ]; then
            STATUS=$(python3 - << 'PY'
          import json
          h = json.load(open("history.json"))
          posted = [e for e in h if e["status"] == "posted"]; pending = [e for e in h if e["status"] == "pending"]
          print(f"Posted so far: {len(posted)}\nWaiting in queue: {len(pending)}\nNext up: " + ", ".join(e.get("title", e["folder"]) for e in sorted(pending, key=lambda e: e.get("priority", 999))[:3]))
          PY
          )
            bash scripts/notify.sh "$(printf '🔔 Test from the reel pipeline (@unexplored.truths)\n%s' "$STATUS")"
          fi
          fi
      - run: |
          git config user.name "autoreel-bot"; git config user.email "autoreel-bot@users.noreply.github.com"
          git add logs && git commit -qm "telegram setup" && git pull -q --rebase && git push -q || true
