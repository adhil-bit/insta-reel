name: Test setup

# Renders a short sample reel with no API keys, to check the cloud setup works.
on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install Python packages and the rendering browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render the preview
        run: python main.py preview

      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            output/_preview/preview.mp4
            output/_preview/cover.jpg
            output/_preview/scene.jpg
